<style>
  /* ==== PFC shell — everything below is 98.css-native or inspired by it ==== */
  :root { --safe: 36px; --tb: calc(36px + var(--safe)); }
  @media (max-width: 700px) {
    :root { --safe: max(env(safe-area-inset-bottom, 0px), 36px); }
  }
  @media (display-mode: standalone) and (max-width: 700px) {
    :root { --safe: max(env(safe-area-inset-bottom, 0px), 60px); }
  }
  html.sim { --safe: 60px; }
  /* The dead zone under the Start bar: an Active-Desktop-style ticker.
     Non-interactive on purpose — it lives in the home-gesture area. */
  #ticker { position: absolute; left: 4px; right: 4px; bottom: 3px;
            height: calc(var(--safe) - 7px); overflow: hidden; background: #000;
            box-shadow: inset -1px -1px #fff, inset 1px 1px #808080;
            pointer-events: none; }
  #ticker .tape { position: absolute; white-space: nowrap; color: #00ff00;
                  font-family: "Courier New", monospace; font-size: 14px; font-weight: bold;
                  line-height: calc(var(--safe) - 7px);
                  animation: tick 40s linear infinite; }
  @keyframes tick { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body { background: #008080; font-family: "Pixelated MS Sans Serif", Arial, sans-serif; }

  /* Desktop + icons */
  #desktop { position: fixed; inset: 0 0 var(--tb) 0; overflow: hidden; }
  .desktop-icons { position: absolute; top: 8px; left: 8px; display: flex;
                   flex-direction: column; gap: 14px; }
  .desktop-icon { width: 84px; text-align: center; color: white; cursor: pointer;
                  user-select: none; -webkit-user-select: none; }
  .desktop-icon .ico { height: 32px; }
  .desktop-icon .lbl { font-size: 13px; margin-top: 3px; padding: 1px 2px;
                       text-shadow: 1px 1px 0 #000; }
  .desktop-icon:focus .lbl, .desktop-icon.selected .lbl
                     { background: #000080; outline: 1px dotted #fff; }

  /* Windows (depth comes from 98.css bevels — Win98 had no soft shadows) */
  .window.app { position: absolute; display: none; min-width: 260px; }
  .window.app.open { display: flex; flex-direction: column; }
  .window.app .window-body { flex: 1; overflow: auto; margin: 3px;
                             background: #c0c0c0; }
  .window.app .window-body.white { background: #fff; }
  .title-bar { cursor: default; touch-action: none; }
  .desktop-icon img, #start-menu img, #start-btn img { image-rendering: pixelated; }

  /* Taskbar */
  #taskbar { position: fixed; left: 0; right: 0; bottom: 0; height: var(--tb); box-sizing: border-box;
             background: #c0c0c0; display: flex; align-items: center; gap: 4px;
             padding: 2px 4px calc(2px + var(--safe)); box-shadow: inset 0 1px 0 #fff; z-index: 9000;
             border-top: 1px solid #dfdfdf; }
  #taskbar button { min-width: 0; }
  #start-btn { font-weight: bold; display: flex; align-items: center; gap: 4px; }
  #task-buttons { display: flex; gap: 3px; flex: 1; overflow: hidden; }
  #task-buttons button { max-width: 160px; overflow: hidden; white-space: nowrap;
                         text-overflow: ellipsis; flex: 0 1 auto; }
  #task-buttons button.pressed { box-shadow: inset -1px -1px #fff,
      inset 1px 1px #0a0a0a, inset -2px -2px #dfdfdf, inset 2px 2px #808080;
      background: repeating-conic-gradient(#fff 0 25%, #c0c0c0 0 50%) 0 0/2px 2px; }
  #tray { display: flex; align-items: center; gap: 6px; padding: 0 8px;
          height: 26px; box-shadow: inset 1px 1px #808080, inset -1px -1px #fff;
          font-size: 13px; }

  /* Start menu */
  #start-menu { position: fixed; bottom: var(--tb); left: 2px; width: 230px;
                display: none; z-index: 9500; background: #c0c0c0; padding: 2px;
                box-shadow: inset -1px -1px #0a0a0a, inset 1px 1px #dfdfdf,
                            inset -2px -2px #808080, inset 2px 2px #fff; }
  #start-menu.open { display: flex; }
  #start-menu .side { width: 24px; background: #000080; color: #fff;
                      writing-mode: vertical-rl; transform: rotate(180deg);
                      font-weight: bold; font-size: 15px; padding: 8px 2px;
                      letter-spacing: 1px; }
  #start-menu ul { list-style: none; margin: 0; padding: 0; flex: 1; }
  #start-menu li { padding: 10px 12px; display: flex; gap: 10px; cursor: pointer;
                   font-size: 14px; align-items: center; }
  #start-menu li:hover { background: #000080; color: #fff; }
  #start-menu li.sep { border-top: 1px solid #808080; border-bottom: 1px solid #fff;
                       padding: 0; margin: 3px 0; }

  /* Pulse stat tiles (dataviz: values in ink, labels muted, no color-as-data) */
  .pulse { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px; }
  .stat-tile { flex: 1 1 90px; min-width: 90px; padding: 6px 8px;
               box-shadow: inset -1px -1px #fff, inset 1px 1px #808080; }
  .stat-tile .v { font-size: 28px; font-weight: bold; line-height: 1.1; }
  .stat-tile .v.small { font-size: 18px; padding-top: 5px; white-space: nowrap; }
  .stat-tile .l { font-size: 12px; color: #444; margin-top: 2px;

  .backfill { margin: 0 6px 6px 6px; }
  .backfill .l { font-size: 12px; color: #444; margin-bottom: 3px;
                 text-transform: uppercase; letter-spacing: .5px; }

  /* Markdown rendering */
  .md { padding: 12px 16px; font-size: 16px; line-height: 1.6;

  .md h1 { font-size: 18px; } .md h2 { font-size: 15px; } .md h3 { font-size: 13px; }
  .md h1, .md h2 { border-bottom: 1px solid #c0c0c0; padding-bottom: 2px; }
  .md pre { background: #f4f4f4; border: 1px inset #fff; padding: 8px;

  .md code { font-family: "Courier New", monospace; }
  .md blockquote { border-left: 3px solid #c0c0c0; margin-left: 0;

  .md table { border-collapse: collapse; }
  .md th, .md td { border: 1px solid #999; padding: 4px 9px; font-size: 14px; }

  a.wikilink.missing { color: #800000; border-bottom-color: #800000; }

  /* Explorer layout — deep 3D wells come from 98.css sunken-panel */
  #win-explorer .window-body { display: flex; padding: 0; overflow: hidden; }
  #explorer-left { display: flex; flex-direction: column; width: 190px; margin: 2px; flex: none; }
  #tree-bar { flex: none; padding: 5px 9px; font-size: 13px; cursor: pointer; user-select: none;

  #explorer-tree { flex: 1; overflow: auto; background: #fff; }
  .tree-collapsed #explorer-tree { display: none; }
  .tree-collapsed #explorer-left { width: auto; }
  #explorer-view { flex: 1; overflow: auto; background: #fff; margin: 2px 2px 2px 0; }
  ul.tree-view { border: none; box-shadow: none; }
  ul.tree-view li { cursor: pointer; }
  ul.tree-view li.sel > span { background: #000080; color: #fff; }
  #backlinks { padding: 8px 16px 12px; font-size: 14px; background: #c0c0c0;
               box-shadow: inset 0 1px 0 #808080, inset 0 2px 0 #fff; }

  /* Recent changes */
  .log-line { display: flex; gap: 8px; padding: 6px 10px; font-size: 14px;
              border-bottom: 1px solid #dfdfdf; font-family: Arial; }
  .log-line .d { color: #444; white-space: nowrap; }
  .log-line .p { font-weight: bold; white-space: nowrap; }

  /* Search */
  #win-search .row { display: flex; gap: 4px; padding: 6px; }
  #win-search input { flex: 1; }
  .result { padding: 9px 12px; cursor: pointer; border-bottom: 1px solid #dfdfdf;

  .result:hover { background: #000080; color: #fff; }
  .result:hover .t, .result:hover .s { color: #fff; }
  .result .t { font-weight: bold; color: #000080; }
  .result .s { color: #333; margin-top: 2px; }
  .result .s b { background: #ffffe1; color: #000; font-weight: normal; }

  .oracle-item.pending { padding: 10px 12px; font-family: Arial; font-size: 14px; }
  .oracle-item .fine { color: #444; font-size: 12px; margin-top: 3px; }

  /* Logon + dialogs */
  #logon { position: fixed; inset: 0; background: #008080; z-index: 9999;
           display: flex; align-items: center; justify-content: center; }
  #logon .window { width: min(400px, 92vw); }
  #logon .intro { display: flex; gap: 12px; align-items: flex-start; margin: 4px 0 10px; }
  #logon .intro img { width: 32px; height: 32px; image-rendering: pixelated; }
  #logon .fine { font-size: 12px; color: #444; margin-top: 4px; }
  .hidden { display: none !important; }
  .toolbar { display: flex; gap: 4px; padding: 4px; align-items: center;
             border-bottom: 1px solid #808080; box-shadow: 0 1px 0 #fff; }
  .toolbar .spacer { flex: 1; }
  .toolbar .note { font-size: 13px; color: #444; }

  ul.tree-view { font-size: 14px; line-height: 1.7; }
  .window-body textarea, .window-body input, #win-search input { font-size: 15px; }
  button { min-height: 26px; }
  .title-bar-text { font-size: 13px; }
  label { font-size: 13px; }

  /* Mobile: windows maximize, taskbar is the navigator */
  @media (max-width: 700px) {
    .window.app { position: fixed !important; left: 0 !important; top: 0 !important;
                  right: 0 !important; bottom: var(--tb) !important;
                  width: auto !important; height: auto !important; }
    .window.app .title-bar-controls button[aria-label="Maximize"] { display: none; }
    /* Explorer: over/under, not side-by-side — full-width tree, full-width reading */
    #win-explorer .window-body { flex-direction: column; }
    #explorer-left { width: auto; height: 34%; min-height: 130px; }
    .tree-collapsed #explorer-left { height: auto; min-height: 0; }
    #explorer-view { margin: 2px; }
    ul.tree-view { line-height: 2.1; font-size: 15px; }
    ul.tree-view li { padding: 1px 0; }
    .toolbar { flex-wrap: wrap; }
    .desktop-icons { flex-direction: row; flex-wrap: wrap; top: auto; bottom: 40px; }
  }

  Z = ZOOMS[(ZOOMS.indexOf(Z) + 1) % ZOOMS.length] || 1.25;
  localStorage.setItem("pfc_zoom", Z);
  document.documentElement.style.zoom = Z;
  const b = document.getElementById("zoom-btn");
  if (b) b.textContent = `AA ${Math.round(Z * 100)}%`;

}

if (location.search.includes("sim")) document.documentElement.classList.add("sim");
function setTicker(txt) {

  t.textContent = unit.repeat(8); // even repeats -> seamless -50% loop
  requestAnimationFrame(() => {   // constant crawl: ~28 layout px/sec regardless of content length
    t.style.animationDuration = Math.max(30, Math.round(t.scrollWidth / 2 / 28)) + "s";
  });
}

/* ---------------- Pixel-art icons (Win98 16-color palette) ---------------- */
const PAL = { k:"#000000", w:"#ffffff", s:"#c0c0c0", d:"#808080", y:"#ffff00", l:"#cfc8e8",
              Y:"#808000", r:"#ff0000", g:"#008000", G:"#00ff00", b:"#000080",
              B:"#0000ff", c:"#008080", t:"#00ffff", p:"#ff80c0", P:"#800080",
              o:"#ff8000" };
/* Canvas-baked icons: each 16x16 art pixel maps to a WHOLE number of device
   pixels (zoom- and DPI-aware), so edges land exactly on the raster — no
   antialias seams, no fractional smearing. Re-baked on zoom change. */
function bakeIcon(rows, targetCss) {
  const dpr = window.devicePixelRatio || 1;
  const S = Math.max(2, Math.round(targetCss * Z * dpr / 16)); // integer art-pixel scale
  const c = document.createElement("canvas");
  c.width = c.height = 16 * S;
  const g = c.getContext("2d");
  rows.forEach((row, y) => {
    for (let i = 0; i < row.length; i++) {
      const ch = row[i];
      if (ch !== ".") { g.fillStyle = PAL[ch]; g.fillRect(i * S, y * S, S, S); }
    }
  });
  return { src: c.toDataURL(), px: (16 * S) / (Z * dpr) };
}
function refreshIcons() {
  document.querySelectorAll("img[data-icon]").forEach(img => {
    const rows = ART[img.dataset.icon];
    if (!rows) return;
    const { src, px } = bakeIcon(rows, +img.dataset.sz || 32);
    img.src = src;
    img.style.width = img.style.height = px + "px";
  });
}

/* ---------------- GitHub data layer ---------------- */
const cache = { tree: null, files: new Map() };

function token() { return localStorage.getItem(LS_KEY) || ""; }

async function gh(path, opts = {}) {
  const r = await fetch(`https://api.github.com${path}`, {
    ...opts,
    headers: {
      "Authorization": `Bearer ${token()}`,
      "Accept": "application/vnd.github+json",
      "X-GitHub-Api-Version": "2022-11-28",
      ...(opts.headers || {})
    }
  });
  if (r.status === 401) { throw new Error("auth"); }
  if (r.status === 403) {
    // 403 is rate-limiting more often than credentials — never nuke the token for it
    if (r.headers.get("x-ratelimit-remaining") === "0" || r.headers.get("retry-after"))
      throw new Error("rate");
    throw new Error("forbidden");
  }
  if (!r.ok) { throw new Error(`GitHub ${r.status} on ${path}`); }
  return r.json();
}

function b64decode(b64) {
  const bin = atob(b64.replace(/\s/g, ""));
  const bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
  return new TextDecoder("utf-8").decode(bytes);
}
function b64encode(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = "";
  bytes.forEach(b => bin += String.fromCharCode(b));
  return btoa(bin);
}

async function getTree(force) {
  if (cache.tree && !force) return cache.tree;
  if (DEMO) { cache.tree = Object.keys(DEMO_FILES).map(p => ({ path: p, type: "blob" })); return cache.tree; }
  const d = await gh(`/repos/${CFG.owner}/${CFG.repo}/git/trees/${CFG.branch}?recursive=1`);
  cache.tree = d.tree.filter(e => e.type === "blob");
  return cache.tree;
}

async function getFile(path, force) {
  if (cache.files.has(path) && !force) return cache.files.get(path);
  let text;
  if (DEMO) {
    text = DEMO_FILES[path];
    if (text === undefined) throw new Error(`demo has no ${path}`);
  } else {
    const d = await gh(`/repos/${CFG.owner}/${CFG.repo}/contents/${encodeURIComponent(path).replace(/%2F/g, "/")}?ref=${CFG.branch}`);
    text = b64decode(d.content);
  }
  cache.files.set(path, text);
  return text;
}

async function getFileFull(path) { // fresh, uncached, with sha (for editing)
  if (DEMO) return { text: DEMO_FILES[path] ?? "", sha: "demo" };
  const d = await gh(`/repos/${CFG.owner}/${CFG.repo}/contents/${encodeURIComponent(path).replace(/%2F/g, "/")}?ref=${CFG.branch}`);
  return { text: b64decode(d.content), sha: d.sha };
}
async function putFileSha(path, content, message, sha) { // sha = edit watcher: mismatch throws
  if (DEMO) { await new Promise(r => setTimeout(r, 300)); return; }
  await gh(`/repos/${CFG.owner}/${CFG.repo}/contents/${encodeURIComponent(path).replace(/%2F/g, "/")}`, {
    method: "PUT",
    body: JSON.stringify({ message, content: b64encode(content), branch: CFG.branch, ...(sha ? { sha } : {}) })
  });
  cache.tree = null; cache.files.delete(path);
}
async function putCapture(text, kind = "web") {
  const now = new Date();
  const pad = n => String(n).padStart(2, "0");
  const stamp = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`;
  const hm = `${pad(now.getHours())}${pad(now.getMinutes())}${pad(now.getSeconds())}`;
  const path = `inbox/${stamp}-${hm}-${kind}.md`;
  const body = `---\ncaptured: ${now.toISOString()}\nvia: ${kind}\n${kind === "oracle" ? "type: question\n" : ""}---\n${text.trim()}\n`;
  if (DEMO) { await new Promise(r => setTimeout(r, 400)); return path + " (demo — not saved)"; }
  await gh(`/repos/${CFG.owner}/${CFG.repo}/contents/${path}`, {
    method: "PUT",
    body: JSON.stringify({ message: `capture: via ${kind} (${stamp} ${pad(now.getHours())}:${pad(now.getMinutes())})`,
                           content: b64encode(body), branch: CFG.branch })
  });
  cache.tree = null; // tree changed
  return path;
}

/* ---------------- Markdown helpers ---------------- */
function slugify(s) { return s.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, ""); }

function splitFrontmatter(md) {
  const m = md.match(/^---\n([\s\S]*?)\n---\n?/);
  if (!m) return { meta: {}, body: md };
  const meta = {};
  m[1].split("\n").forEach(line => {
    const i = line.indexOf(":");
    if (i > 0) meta[line.slice(0, i).trim()] = line.slice(i + 1).trim();
  });
  return { meta, body: md.slice(m[0].length) };
}

/* Minimal fallback renderer if marked ever fails to load */
function miniMd(md) {
  const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");
  return esc(md)
    .replace(/^### (.*)$/gm, "<h3>$1</h3>")
    .replace(/^## (.*)$/gm, "<h2>$1</h2>")
    .replace(/^# (.*)$/gm, "<h1>$1</h1>")
    .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/^- (.*)$/gm, "<li>$1</li>")
    .replace(/(<li>[\s\S]*?<\/li>)(?!\s*<li>)/g, "<ul>$1</ul>")
    .replace(/\n\n/g, "<p></p>");
}

function renderMd(md, el) {
  const { meta, body } = splitFrontmatter(md);
  let html = (typeof marked !== "undefined")
    ? marked.parse(body, { mangle: false, headerIds: false })
    : miniMd(body);
  // Linkify [[wikilinks]] — but never inside code/pre, where they are literal syntax
  html = html.split(/(<pre[\s\S]*?<\/pre>|<code[\s\S]*?<\/code>)/g).map((seg, i) =>
    i % 2 === 1 ? seg : seg.replace(/\[\[([^\]|]+)\]\]/g, (_, name) => {
      if (name.includes("/")) { // tier link (e.g. sessions/claude/…): open by path
        const path = name.endsWith(".md") ? name : name + ".md";
        const label = name.split("/").pop();
        return `<a class="wikilink" data-path="${path}">${label}</a>`;
      }
      const slug = slugify(name);
      const exists = cache.tree && cache.tree.some(e => e.path === `wiki/${slug}.md`);
      return `<a class="wikilink${exists ? "" : " missing"}" data-page="${slug}">${name}</a>`;
    })).join("");
  let chips = "";
  ["type", "created", "updated", "tags"].forEach(k => {
    if (meta[k]) chips += `<span class="frontmatter-chip">${k}: ${meta[k].replace(/[\[\]]/g, "")}</span>`;
  });
  el.innerHTML = (chips ? `<div style="padding:8px 14px 0">${chips}</div>` : "") +
                 `<div class="md">${html}</div>`;
  el.querySelectorAll("a.wikilink").forEach(a =>
    a.addEventListener("click", () => a.dataset.path
      ? (WM.show("explorer"), Explorer.openPath(a.dataset.path))
      : Explorer.openPage(a.dataset.page)));
  el.querySelectorAll("a[href^='http']").forEach(a => a.target = "_blank");
}

/* ---------------- Window manager ---------------- */
const WM = (() => {
  let z = 100;
  const open = new Set();
  const isMobile = () => matchMedia("(max-width: 700px)").matches;

  function make(id, title, w, h, x, y) {
    const el = document.createElement("div");
    el.className = "window app";
    el.id = `win-${id}`;
    el.style.cssText = `width:${w}px;height:${h}px;left:${x}px;top:${y}px;`;
    el.innerHTML = `
      <div class="title-bar">
        <div class="title-bar-text">${title}</div>
        <div class="title-bar-controls">
          <button aria-label="Minimize"></button>
          <button aria-label="Maximize"></button>
          <button aria-label="Close"></button>
        </div>
      </div>
      <div class="window-body white"></div>
      <div class="status-bar"><p class="status-bar-field">Ready</p>${DEMO ? '<p class="status-bar-field">Demo — nothing is saved</p>' : ''}</div>`;
    document.getElementById("desktop").appendChild(el);
    const [btnMin, btnMax, btnClose] = el.querySelectorAll(".title-bar-controls button");
    btnClose.addEventListener("click", () => close(id));
    btnMin.addEventListener("click", () => minimize(id));
    btnMax.addEventListener("click", () => maximize(el));
    el.addEventListener("pointerdown", () => focus(id));
    drag(el);
    return el;
  }

  function drag(el) {
    const bar = el.querySelector(".title-bar");
    let sx, sy, ox, oy, dragging = false;
    bar.addEventListener("pointerdown", e => {
      if (e.target.tagName === "BUTTON" || isMobile() || el.dataset.max) return;
      dragging = true; sx = e.clientX; sy = e.clientY;
      ox = el.offsetLeft; oy = el.offsetTop;
      bar.setPointerCapture(e.pointerId);
    });
    bar.addEventListener("pointermove", e => {
      if (!dragging) return;
      el.style.left = Math.max(-40, ox + (e.clientX - sx) / Z) + "px";
      el.style.top = Math.max(0, oy + (e.clientY - sy) / Z) + "px";
    });
    bar.addEventListener("pointerup", () => dragging = false);
  }

  function maximize(el) {
    const btn = el.querySelector('.title-bar-controls button:nth-child(2)');
    if (el.dataset.max) {
      el.style.cssText = el.dataset.max; delete el.dataset.max;
      btn.setAttribute("aria-label", "Maximize");
    } else {
      el.dataset.max = el.style.cssText;
      el.style.cssText = "left:0;top:0;width:100%;height:calc(100% - 0px);";
      btn.setAttribute("aria-label", "Restore");
    }
  }

  function focus(id) {
    document.querySelectorAll(".window.app .title-bar").forEach(t => t.classList.add("inactive"));
    const el = document.getElementById(`win-${id}`);
    if (!el) return;
    el.querySelector(".title-bar").classList.remove("inactive");
    el.style.zIndex = ++z;
    if (isMobile()) {
      document.querySelectorAll(".window.app").forEach(w => {
        if (w !== el) w.classList.remove("open");
      });
      el.classList.add("open");
    }
    syncTaskbar(id);
  }

  function show(id) {
    const el = document.getElementById(`win-${id}`);
    el.classList.add("open");
    open.add(id);
    focus(id);
    renderTaskButtons();
    APPS[id].onOpen && APPS[id].onOpen();
  }
  function close(id) {
    document.getElementById(`win-${id}`).classList.remove("open");
    open.delete(id);
    renderTaskButtons();
  }
  function minimize(id) {
    document.getElementById(`win-${id}`).classList.remove("open");
    syncTaskbar(null);
  }

  function renderTaskButtons() {
    const tb = document.getElementById("task-buttons");
    tb.innerHTML = "";
    open.forEach(id => {
      const b = document.createElement("button");
      b.textContent = APPS[id].title;
      b.dataset.win = id;
      b.addEventListener("click", () => {
        const el = document.getElementById(`win-${id}`);
        if (el.classList.contains("open") && !el.classList.contains("inactive")) minimize(id);
        else { el.classList.add("open"); focus(id); }
      });
      tb.appendChild(b);
    });
    const active = document.querySelector(".window.app.open:not(.inactive)");
    syncTaskbar(active ? active.id.slice(4) : null);
  }
  function syncTaskbar(id) {
    document.querySelectorAll("#task-buttons button").forEach(b =>
      b.classList.toggle("pressed", b.dataset.win === id));
  }

  function status(id, text) {
    const f = document.querySelector(`#win-${id} .status-bar-field`);
    if (f) f.textContent = text;
  }
  return { make, show, close, focus, status };
})();

/* ----- Surface.exe ----- */
const Surface = (() => {
  let briefs = [], idx = 0;
  const el = () => document.querySelector("#win-surface .window-body");

  async function pulse() {
    const tree = await getTree();
    const pages = tree.filter(e => /^wiki\/.+\.md$/.test(e.path)).length;
    const inbox = tree.filter(e => /^inbox\/[^/]+\.md$/.test(e.path) && !e.path.endsWith("README.md")).length;
    let done = 0, total = 28;
    try {
      const man = await getFile("raw/chat-exports/PROCESSED.md");
      done = (man.match(/^\d{4}-\d{2}\s*\|.*\|\s*done/gm) || []).length;
      const t = man.match(/(\d+)\s+months total/); if (t) total = +t[1];
    } catch (e) { /* manifest optional */ }
    let lastBeat = "—";
    try {
      const log = await getFile("log.md");
      const beats = log.match(/## \[([0-9-]+)\] heartbeat[^\n]*/g);
      if (beats) lastBeat = beats[beats.length - 1].match(/\[([0-9-]+)\]/)[1];
    } catch (e) {}
    const pct = Math.round(100 * done / total);
    return `
      <div class="pulse">
        <div class="stat-tile"><div class="v">${pages}</div><div class="l">wiki pages</div></div>
        <div class="stat-tile"><div class="v">${inbox}</div><div class="l">inbox pending</div></div>
        <div class="stat-tile"><div class="v small">${lastBeat}</div><div class="l">last heartbeat</div></div>
      </div>
      <div class="backfill">
        <div class="l">corpus backfill — ${done}/${total} months (${pct}%)</div>
        <div class="progress-indicator segmented">
          <span class="progress-indicator-bar" style="width:${Math.max(pct,2)}%"></span>
        </div>
      </div>`;
  }

  async function render() {
    WM.status("surface", "Loading…");
    const tree = await getTree();
    briefs = tree.filter(e => /^surface\/\d{4}-\d{2}-\d{2}\.md$/.test(e.path))
                 .map(e => e.path).sort().reverse();
    if (idx >= briefs.length) idx = 0;
    const body = el();
    const pulseHtml = await pulse();
    if (!briefs.length) {
      body.innerHTML = pulseHtml + `<div class="md"><p>No surface briefs yet.</p></div>`;
      WM.status("surface", "No briefs"); return;
    }
    const path = briefs[idx];
    const md = await getFile(path);
    body.innerHTML = `
      <div class="toolbar">
        <button id="sf-prev" ${idx >= briefs.length - 1 ? "disabled" : ""}>◀ Older</button>
        <button id="sf-next" ${idx <= 0 ? "disabled" : ""}>Newer ▶</button>
        <span class="note">${path.slice(8, 18)}</span>
        <div class="spacer"></div>
        <button id="sf-beat" title="Signal the hourly pulse to run a full beat">\u2665 Beat now</button>
        <button id="sf-refresh">Refresh</button>
      </div>
      ${pulseHtml}<div id="sf-md"></div>`;
    renderMd(md, body.querySelector("#sf-md"));
    body.querySelector("#sf-prev").onclick = () => { idx++; render(); };
    body.querySelector("#sf-next").onclick = () => { idx--; render(); };
    body.querySelector("#sf-beat").onclick = async () => {
      const btn = body.querySelector("#sf-beat");
      btn.disabled = true;
      WM.status("surface", "Signaling…");
      try {
        const now = new Date(), pad = n => String(n).padStart(2, "0");
        const stamp = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}-${pad(now.getHours())}${pad(now.getMinutes())}${pad(now.getSeconds())}`;
        await putFileSha(`inbox/${stamp}-beatnow.md`,
          `---\nvia: face\ntype: beat-request\nrequested: ${now.toISOString()}\n---\nFull beat requested from Surface.exe.\n`,
          "signal: beat now");
        WM.status("surface", "Beat requested \u2014 the pulse checks hourly and will run a full beat.");
      } catch (e) { WM.status("surface", "Signal failed \u2014 " + e.message); }
      finally { btn.disabled = false; }
    };
    body.querySelector("#sf-refresh").onclick = async () => {
      cache.tree = null; cache.files.clear(); Search.invalidate(); render();
    };
    WM.status("surface", `${briefs.length} brief${briefs.length > 1 ? "s" : ""} · ${path}`);
    try { // feed the ticker: pulse line + first connection, markdown stripped
      const conn = (md.match(/^- \*\*(.+)$/m) || [,""])[1]
        .replace(/\[\[|\]\]|\*\*/g, "").replace(/\s+/g, " ").slice(0, 160);
      const pulse = (md.match(/^## Pulse\n(.+)$/m) || [,""])[1];
      setTicker([pulse, conn && ("LATEST: " + conn)].filter(Boolean).join("  \u2726  ") ||
                "Post Frontal Cortex \u2014 it remembers for you, and brings the right thing back");
    } catch (e) {}
  }
  APPS.surface.onOpen = () => render().catch(err);
  return { render };
})();

/* ----- Wiki Explorer ----- */
const Explorer = (() => {
  let current = null;
  const body = () => document.querySelector("#win-explorer .window-body");

  async function ensureLayout() {
    if (document.getElementById("explorer-tree")) return;
    body().classList.remove("white");
    body().innerHTML = `
      <div id="explorer-left">
        <div id="tree-bar" role="button">\u25BE Index</div>
        <div id="explorer-tree" class="sunken-panel"><ul class="tree-view" id="tree-root"></ul></div>
      </div>
      <div id="explorer-view" class="sunken-panel"><div class="md"><p>Select a page.</p></div></div>`;
    const bar = document.getElementById("tree-bar");
    const applyCollapse = c => {
      body().classList.toggle("tree-collapsed", c);
      bar.textContent = (c ? "\u25B8" : "\u25BE") + " Index";
      localStorage.setItem("pfc_tree_collapsed", c ? "1" : "");
    };
    bar.addEventListener("click", () => applyCollapse(!body().classList.contains("tree-collapsed")));
    applyCollapse(localStorage.getItem("pfc_tree_collapsed") === "1");
  }

  async function renderTree() {
    const tree = await getTree();
    const root = document.getElementById("tree-root");
    const groups = {
      "Wiki": tree.filter(e => /^wiki\/.+\.md$/.test(e.path)),
      "Protocol": tree.filter(e => /^protocol\/.+\.md$/.test(e.path)),
      "Surface": tree.filter(e => /^surface\/.+\.md$/.test(e.path)).slice(-14).reverse(),
      "Sessions · claude": tree.filter(e => /^sessions\/claude\/.+\.md$/.test(e.path)),
      "Sessions · gemini": tree.filter(e => /^sessions\/gemini\/.+\.md$/.test(e.path)),
      "Root": tree.filter(e => /^(index|log)\.md$/.test(e.path)),
    };
    root.innerHTML = "";
    for (const [g, items] of Object.entries(groups)) {
      if (!items.length) continue;
      const li = document.createElement("li");
      const det = document.createElement("details");
      det.open = g === "Wiki";
      det.innerHTML = `<summary>${g} (${items.length})</summary>`;
      const ul = document.createElement("ul");
      if (g !== "Surface") items.sort((a, b) => a.path.localeCompare(b.path)); // Surface stays newest-first
      if (g.startsWith("Sessions")) items.reverse(); // episodic tier: newest first
      const build = () => items.forEach(e => {
        const item = document.createElement("li");
        const label = e.path.replace(/^(wiki|protocol|surface|sessions\/\w+)\//, "").replace(/\.md$/, "");
        item.innerHTML = `<span>${label}</span>`;
        item.dataset.path = e.path;
        item.addEventListener("click", ev => { ev.stopPropagation(); openPath(e.path); });
        ul.appendChild(item);
      });
      if (g.startsWith("Sessions")) { // lazy: 600+ episodic files build on first expand
        det.addEventListener("toggle", () => { if (det.open && !ul.childElementCount) build(); }, { once: false });
      } else build();
      det.appendChild(ul); li.appendChild(det); root.appendChild(li);
    }
  }

  async function backlinksFor(slug) {
    const tree = await getTree();
    const pages = tree.filter(e => /^wiki\/.+\.md$/.test(e.path));
    const hits = [];
    for (const p of pages) {
      if (p.path === `wiki/${slug}.md`) continue;
      try {
        const txt = await getFile(p.path);
        const links = [...txt.matchAll(/\[\[([^\]|]+)\]\]/g)].map(m => slugify(m[1]));
        if (links.includes(slug)) hits.push(p.path.slice(5, -3));
      } catch (e) {}
    }
    return hits;
  }

  async function openPath(path) {
    await ensureLayout();
    WM.status("explorer", "Loading " + path);
    document.querySelectorAll("#tree-root li").forEach(li =>
      li.classList.toggle("sel", li.dataset.path === path));
    const view = document.getElementById("explorer-view");
    const md = await getFile(path);
    renderMd(md, view);
    view.scrollTop = 0;
    current = path;
    if (/^wiki\//.test(path)) {
      const slug = path.slice(5, -3);
      backlinksFor(slug).then(bl => {
        if (current !== path) return; // user already navigated elsewhere
        const div = document.createElement("div");
        div.id = "backlinks";
        div.innerHTML = bl.length
          ? "↩ Linked from: " + bl.map(s =>
              `<a class="wikilink" data-page="${s}">${s}</a>`).join(" · ")
          : "↩ No backlinks yet.";
        view.appendChild(div);
        div.querySelectorAll("a.wikilink").forEach(a =>
          a.addEventListener("click", () => openPage(a.dataset.page)));
      });
    }
    WM.status("explorer", path);
  }

  function openPage(slug) {
    WM.show("explorer");
    openPath(`wiki/${slug}.md`).catch(() =>
      WM.status("explorer", `wiki/${slug}.md does not exist yet`));
  }

  APPS.explorer.onOpen = async () => {
    await ensureLayout();
    renderTree().catch(err);
    if (!current) openPath("wiki/post-frontal-cortex.md").catch(() => {});
  };
  return { openPage, openPath };
})();

/* ----- Notes: Write | Prior tabs, edit pending notes with upstream-change watcher ----- */
(() => {
  let editing = null; // {path, sha, front} when editing an existing pending note
  const body = () => document.querySelector("#win-note .window-body");

  function splitNote(raw) {
    const m = raw.match(/^(---\n[\s\S]*?\n---\n?)([\s\S]*)$/);
    return m ? { front: m[1], text: m[2].trim() } : { front: "", text: raw.trim() };
  }
  function setMode(tab) {
    body().querySelectorAll("[role=tab]").forEach(li =>
      li.setAttribute("aria-selected", li.dataset.tab === tab));
    body().querySelector("#note-write").style.display = tab === "write" ? "flex" : "none";
    body().querySelector("#note-prior").style.display = tab === "prior" ? "block" : "none";
    if (tab === "prior") renderPrior();
  }
  function setEditing(e) {
    editing = e;
    const ta = body().querySelector("#note-text");
    body().querySelector("#note-save").textContent = e ? "Save changes" : "Save to inbox";
    body().querySelector("#note-new").style.display = e ? "" : "none";
    WM.status("note", e ? `Editing ${e.path}` : "New note");
    ta.focus();
  }
  async function renderPrior() {
    const list = body().querySelector("#note-prior");
    list.innerHTML = "<div class='md'><p>Loading…</p></div>";
    const tree = await getTree(true);
    const pending = tree.filter(e => /^inbox\/[^/]+\.md$/.test(e.path)
      && !e.path.endsWith("README.md") && !/-oracle\.md$/.test(e.path)).map(e => e.path).sort().reverse();
    const filed = tree.filter(e => /^inbox\/processed\/.+\.md$/.test(e.path)
      && !/-oracle\.md$/.test(e.path)).map(e => e.path).sort().reverse().slice(0, 30);
    const row = (p, state) => {
      const name = p.split("/").pop().replace(/\.md$/, "");
      return `<div class="result" data-note="${p}" data-state="${state}">
        <div class="t">${state === "pending" ? "\u270E" : "\u2713"} ${name}</div>
        <div class="s">${state === "pending" ? "pending — click to edit" : "filed by the brain — click to view"}</div></div>`;
    };
    list.innerHTML = (pending.map(p => row(p, "pending")).join("") +
                      filed.map(p => row(p, "filed")).join("")) ||
      "<div class='md'><p>No notes yet.</p></div>";
    list.querySelectorAll("[data-note]").forEach(el => el.addEventListener("click", async () => {
      const p = el.dataset.note;
      if (el.dataset.state === "filed") { WM.show("explorer"); Explorer.openPath(p); return; }
      WM.status("note", "Opening…");
      try {
        const { text, sha } = await getFileFull(p);

/* ----- Search ----- */
const Search = (() => {
  let indexPromise = null;
  function invalidate() { indexPromise = null; }
  function buildIndex() {
    if (indexPromise) return indexPromise; // in-flight or done: reuse the same promise
    indexPromise = (async () => {
      const tree = await getTree();
      const paths = tree.filter(e => /\.md$/.test(e.path) &&
        /^(wiki|protocol|surface)\//.test(e.path) || /^(index|log)\.md$/.test(e.path))
        .map(e => e.path);
      const docs = [];
      for (const p of paths) {
        try { docs.push({ path: p, text: await getFile(p) }); } catch (e) {}
      }
      return docs;
    })();
    return indexPromise;
  }
  APPS.search.onOpen = () => {
    const body = document.querySelector("#win-search .window-body");
    if (body.dataset.ready) return;
    body.dataset.ready = 1;
    body.classList.remove("white");
    body.innerHTML = `
      <div class="row"><input id="q" placeholder="Search the brain…">
        <button id="go" class="default">Find</button></div>
      <div id="results" class="sunken-panel" style="overflow:auto; height:calc(100% - 42px); background:#fff; margin:0 6px 6px;"></div>`;
    const q = body.querySelector("#q"), res = body.querySelector("#results");
    async function run() {
      const term = q.value.trim().toLowerCase();
      if (!term) return;
      WM.status("search", "Indexing…");
      const ix = await buildIndex();
      if (q.value.trim().toLowerCase() !== term) return; // superseded by a newer query
      const scored = ix.map(d => {
        const t = d.text.toLowerCase();
        const n = t.split(term).length - 1;
        if (!n) return null;
        const titleHit = d.path.toLowerCase().includes(term) ? 5 : 0;
        const i = t.indexOf(term);
        const snip = d.text.slice(Math.max(0, i - 60), i + 90)
          .replace(/</g, "&lt;")
          .replace(new RegExp(`(${term.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")})`, "ig"), "<b>$1</b>");
        return { path: d.path, score: n + titleHit, snip };
      }).filter(Boolean).sort((a, b) => b.score - a.score).slice(0, 30);
      res.innerHTML = scored.map(s => `
        <div class="result" data-path="${s.path}">
          <div class="t">${s.path}</div><div class="s">…${s.snip}…</div>
        </div>`).join("") || "<div class='md'><p>No matches.</p></div>";
      res.querySelectorAll(".result").forEach(r => r.addEventListener("click", () => {
        WM.show("explorer"); Explorer.openPath(r.dataset.path);
      }));
      WM.status("search", `${scored.length} result${scored.length === 1 ? "" : "s"} for “${term}”`);
    }
    body.querySelector("#go").onclick = run;
    q.onkeydown = e => { if (e.key === "Enter") run(); };
  };
  return { invalidate };
})();

/* ----- why.exe: DO IT FOR HER ----- */
(() => {
  // transparent slots in assets/why-frame.png, % coords, top-to-bottom
  const SLOTS = [
    {l:21.13,t:0,w:24,h:17.41}, {l:64,t:0,w:18.99,h:5.96}, {l:65.07,t:24.94,w:17.31,h:14.75},
    {l:77.37,t:27.29,w:22.69,h:35.45}, {l:30.81,t:28.55,w:4.66,h:7.53},
    {l:24.12,t:31.06,w:6.33,h:10.82}, {l:34.75,t:43.92,w:16.12,h:14.59},
    {l:14.45,t:46.12,w:25.67,h:25.41}, {l:40.24,t:58.2,w:34.39,h:37.49},
    {l:0,t:70.9,w:12.3,h:29.18}, {l:83.22,t:72,w:16.84,h:28.08}
  ];
  const FRAME_AR = 3350 / 2550; // slot real aspect = (w%/h%) * FRAME_AR
  const slotAspect = s => (s.w / s.h) * FRAME_AR;
  let pool = [], assigned = [];
  const photoCache = new Map();

  function demoPlaceholders() {
    return [0, 1, 2].map(i => {
      const c = document.createElement("canvas"); c.width = c.height = 300;
      const g = c.getContext("2d");
      g.fillStyle = ["#ffd9e8", "#d9e8ff", "#e0ffd9"][i]; g.fillRect(0, 0, 300, 300);
      g.fillStyle = "#00000022"; g.font = "bold 44px Arial"; g.textAlign = "center";
      g.fillText("DEMO", 150, 162);
      return { path: c.toDataURL("image/jpeg", 0.8), L: 82 - i * 3, A: 100 };
    });
  }
  async function loadPool() {
    if (DEMO) { pool = demoPlaceholders(); return; }
    const tree = await getTree(true);
    pool = tree.filter(e => /^why\/photos\/.+\.(jpe?g|png)$/i.test(e.path)).map(e => {
      const m = e.path.match(/-L(\d+)-A(\d+)\.\w+$/);
      return { path: e.path, L: m ? +m[1] : 60, A: m ? +m[2] : 100 };
    });
  }
  async function photoSrc(p) {
    if (p.startsWith("data:")) return p;
    if (photoCache.has(p)) return photoCache.get(p);
    const d = await gh(`/repos/${CFG.owner}/${CFG.repo}/contents/${encodeURIComponent(p).replace(/%2F/g, "/")}?ref=${CFG.branch}`);
    const url = `data:image/jpeg;base64,${d.content.replace(/\s/g, "")}`;
    photoCache.set(p, url);
    return url;
  }
  function assign() { // light photos preferred (contrast), aspect-matched (kind crops), fresh each open
    const byLight = [...pool].sort((a, b) => b.L - a.L);
    let eligible = byLight.filter(p => p.L >= 55);
    const want = Math.min(SLOTS.length * 2, byLight.length); // 2x slots keeps variety across opens
    if (eligible.length < want) eligible = byLight.slice(0, want);
    const slots = [...SLOTS.keys()].sort(() => Math.random() - 0.5);
    const cand = [...eligible].sort(() => Math.random() - 0.5);
    assigned = [];
    for (const si of slots) {
      if (!cand.length) break;
      const target = slotAspect(SLOTS[si]);
      cand.sort((a, b) => Math.abs(Math.log((a.A / 100) / target)) - Math.abs(Math.log((b.A / 100) / target)));
      const p = cand.splice(Math.floor(Math.random() * Math.min(3, cand.length)), 1)[0];
      assigned.push({ si, p });
    }
  }
  async function paint() {
    const stage = document.querySelector("#why-stage");
    stage.querySelectorAll("img.why-photo").forEach(el => el.remove());
    for (const { si, p } of assigned) {
      const s = SLOTS[si];
      const img = document.createElement("img");
      img.className = "why-photo";
      const pos = (p.A / 100) < slotAspect(s) ? "50% 25%" : "center"; // vertical crop -> bias to faces
      img.style.cssText = `position:absolute; left:${s.l}%; top:${s.t}%; width:${s.w}%;
        height:${s.h}%; object-fit:cover; object-position:${pos}; z-index:1;`;
      try { img.src = await photoSrc(p.path); } catch (e) { continue; }
      stage.insertBefore(img, stage.querySelector(".why-frame"));
    }
    WM.status("why", DEMO ? "Demo pool — uploads land in the private repo when logged on"
      : `${pool.length} photo${pool.length === 1 ? "" : "s"} in the pool \u00b7 ${SLOTS.length} spaces \u00b7 shuffled fresh each open`);
  }
  async function resizeToJpeg(file, max = 1000) {
    const url = URL.createObjectURL(file);
    const img = new Image();
    await new Promise((ok, no) => { img.onload = ok; img.onerror = no; img.src = url; });
    const sc = Math.min(1, max / Math.max(img.width, img.height));
    const c = document.createElement("canvas");
    c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    const t = document.createElement("canvas"); t.width = t.height = 32;
    t.getContext("2d").drawImage(c, 0, 0, 32, 32);
    const d = t.getContext("2d").getImageData(0, 0, 32, 32).data;
    let sum = 0;
    for (let i = 0; i < d.length; i += 4) sum += 0.299 * d[i] + 0.587 * d[i+1] + 0.114 * d[i+2];
    const L = Math.round(sum / (32 * 32) / 255 * 100);
    const A = Math.max(30, Math.min(300, Math.round(c.width / c.height * 100)));
    URL.revokeObjectURL(url);
    return { b64: c.toDataURL("image/jpeg", 0.82).split(",")[1], tag: `-L${L}-A${A}` };
  }
  APPS.why.onOpen = async () => {
    const body = document.querySelector("#win-why .window-body");
    if (!body.dataset.ready) {
      body.dataset.ready = 1;
      body.classList.remove("white");
      body.innerHTML = `
        <div class="toolbar">
          <button id="why-add" class="default">Add photos</button>
          <button id="why-shuffle">Shuffle</button>
          <input id="why-file" type="file" accept="image/*" multiple style="display:none">
          <div class="spacer"></div><span class="note">DO IT FOR HER</span>
        </div>
        <div style="overflow:auto; margin:6px; background:#fff;
             box-shadow: inset -1px -1px #fff, inset 1px 1px #808080;">
          <div id="why-stage" style="position:relative; width:100%; padding-top:76.12%; background:#fff;">
            <img class="why-frame" src="assets/why-frame.png" alt="DO IT FOR HER"
                 style="position:absolute; inset:0; width:100%; height:100%; z-index:2;">
          </div>
        </div>`;
      const fileIn = body.querySelector("#why-file");
      body.querySelector("#why-add").onclick = () => fileIn.click();
      body.querySelector("#why-shuffle").onclick = () => { assign(); paint(); };
      // Bulk uploader: blobs -> ONE commit (single-file commits trip GitHub's burst
      // throttle ~17 in). Content-hash dedupe: re-selecting everything skips what's up.
      const ghRaw = async (path, opts = {}, tries = 5) => {
        for (let t = 0; ; t++) {
          const r = await fetch(`https://api.github.com${path}`, { ...opts, headers: {
            "Authorization": `Bearer ${token()}`, "Accept": "application/vnd.github+json",
            "X-GitHub-Api-Version": "2022-11-28", ...(opts.headers || {}) } });
          if (r.ok) return r.json();
          if ((r.status === 403 || r.status === 429) && t < tries) {
            const wait = (parseInt(r.headers.get("retry-after")) || 2 ** t * 1.5) * 1000;
            WM.status("why", `GitHub asked for a breather \u2014 waiting ${Math.round(wait/1000)}s\u2026`);
            await new Promise(res => setTimeout(res, wait));
            continue;
          }
          throw new Error(`GitHub ${r.status} on ${path}`);
        }
      };
      const gitBlobSha = async b64 => { // git blob sha1: "blob <len>\0" + bytes
        const bin = atob(b64), bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        const head = new TextEncoder().encode(`blob ${bytes.length}\u0000`);
        const buf = new Uint8Array(head.length + bytes.length);
        buf.set(head); buf.set(bytes, head.length);
        const d = await crypto.subtle.digest("SHA-1", buf);
        return [...new Uint8Array(d)].map(b => b.toString(16).padStart(2, "0")).join("");
      };
      fileIn.onchange = async () => {
        const files = [...fileIn.files]; fileIn.value = "";
        if (!files.length) return;
        const addBtn = body.querySelector("#why-add");
        addBtn.disabled = true;
        try {
          const now = new Date(), pad = n => String(n).padStart(2, "0");
          const stamp = `${now.getFullYear()}${pad(now.getMonth()+1)}${pad(now.getDate())}-${pad(now.getHours())}${pad(now.getMinutes())}${pad(now.getSeconds())}`;
          const items = [];
          for (let i = 0; i < files.length; i++) {
            WM.status("why", `Preparing ${i+1}/${files.length}\u2026`);
            try {
              const r = await resizeToJpeg(files[i]);
              items.push({ b64: r.b64, sha: await gitBlobSha(r.b64),
                           path: `why/photos/${stamp}-${String(i).padStart(3,"0")}${r.tag}.jpg` });
            } catch (e) { /* unreadable file: skip */ }
          }
          if (DEMO) { WM.status("why", "Demo \u2014 nothing is saved."); return; }
          const tree = await getTree(true);
          const have = new Set(tree.filter(e => /^why\/photos\//.test(e.path)).map(e => e.sha));
          const fresh = items.filter(it => !have.has(it.sha));
          const skipped = items.length - fresh.length;
          if (!fresh.length) {
            WM.status("why", `All ${items.length} already in the pool \u2014 nothing to add.`);
            return;
          }
          const entries = [];
          for (let i = 0; i < fresh.length; i++) {
            WM.status("why", `Uploading ${i+1}/${fresh.length}\u2026`);
            const blob = await ghRaw(`/repos/${CFG.owner}/${CFG.repo}/git/blobs`, {
              method: "POST", body: JSON.stringify({ content: fresh[i].b64, encoding: "base64" }) });
            entries.push({ path: fresh[i].path, mode: "100644", type: "blob", sha: blob.sha });
            await new Promise(r => setTimeout(r, 250)); // pace under the burst limit
          }
          WM.status("why", "Committing the batch\u2026");
          for (let attempt = 0; ; attempt++) {
            const head = await ghRaw(`/repos/${CFG.owner}/${CFG.repo}/git/ref/heads/${CFG.branch}`);
            const headCommit = await ghRaw(`/repos/${CFG.owner}/${CFG.repo}/git/commits/${head.object.sha}`);
            const newTree = await ghRaw(`/repos/${CFG.owner}/${CFG.repo}/git/trees`, {
              method: "POST", body: JSON.stringify({ base_tree: headCommit.tree.sha, tree: entries }) });
            const commit = await ghRaw(`/repos/${CFG.owner}/${CFG.repo}/git/commits`, {
              method: "POST", body: JSON.stringify({ message: `why: add ${fresh.length} photos`,
                tree: newTree.sha, parents: [head.object.sha] }) });
            try {
              await ghRaw(`/repos/${CFG.owner}/${CFG.repo}/git/refs/heads/${CFG.branch}`, {
                method: "PATCH", body: JSON.stringify({ sha: commit.sha }) });
              break;
            } catch (e) { // a beat pushed mid-upload: rebase once onto the new head
              if (attempt >= 2) throw e;
              WM.status("why", "The brain pushed mid-upload \u2014 rebasing the batch\u2026");
            }
          }
          cache.tree = null;
          await loadPool(); assign(); await paint();
          WM.status("why", `${fresh.length} added${skipped ? ` \u00b7 ${skipped} already up` : ""} \u00b7 pool now ${pool.length}`);
        } catch (e) {
          WM.status("why", "Upload stopped \u2014 " + e.message + " (re-select everything; duplicates are skipped)");
        } finally { addBtn.disabled = false; }
      };
    }
    WM.status("why", "Loading the pool\u2026");
    try { await loadPool(); assign(); await paint(); } catch (e) { err(e); }
  };
})();

/* ---------------- Desktop, start menu, boot ---------------- */
function err(e) {
  if (e && e.message === "auth") { localStorage.removeItem(LS_KEY); boot(); return; }
  console.error(e); // "rate"/"forbidden"/network: keep the token, surface via window status bars
}

function buildDesktop() {
  const icons = document.getElementById("desktop-icons");
  const items = document.getElementById("start-items");
  icons.innerHTML = ""; items.innerHTML = "";
  Object.entries(APPS).forEach(([id, a]) => {
    const d = document.createElement("div");
    d.className = "desktop-icon"; d.tabIndex = 0;
    d.innerHTML = `<div class="ico"><img data-icon="${id}" data-sz="32" alt=""></div><div class="lbl">${a.title}</div>`;
    d.addEventListener("dblclick", () => WM.show(id));
    d.addEventListener("click", () => {
      document.querySelectorAll(".desktop-icon").forEach(i => i.classList.remove("selected"));
      d.classList.add("selected");
      if (matchMedia("(max-width: 700px)").matches) WM.show(id);
    });
    icons.appendChild(d);
    const li = document.createElement("li");
    li.innerHTML = `<img data-icon="${id}" data-sz="16" alt=""> ${a.title}`;
    li.addEventListener("click", () => { toggleStart(false); WM.show(id); });
    items.appendChild(li);
  });
  const sep = document.createElement("li"); sep.className = "sep"; items.appendChild(sep);
  const off = document.createElement("li");
  off.innerHTML = `<img data-icon="logoff" data-sz="16" alt=""> Log Off`;
  off.addEventListener("click", () => { localStorage.removeItem(LS_KEY); location.href = location.pathname; });
  items.appendChild(off);
}

function toggleStart(force) {
  document.getElementById("start-menu").classList.toggle("open", force);
}
document.getElementById("zoom-btn").textContent = `AA ${Math.round(Z * 100)}%`;
document.getElementById("zoom-btn").addEventListener("click", cycleZoom);
document.getElementById("start-btn").addEventListener("click", e => {
  e.stopPropagation();
  document.getElementById("start-menu").classList.toggle("open");
});
document.addEventListener("click", e => {
  if (!e.target.closest("#start-menu")) toggleStart(false);
});

function tickClock() {
  const n = new Date();
  document.getElementById("clock").textContent =
    `${String(n.getHours() % 12 || 12)}:${String(n.getMinutes()).padStart(2, "0")} ${n.getHours() < 12 ? "AM" : "PM"}`;
}
setInterval(tickClock, 5000); tickClock();

/* Windows (created once) */
function buildWindows() {
  const W = Math.round(innerWidth / Z), cascade = (i) => 90 + i * 26;
  WM.make("surface", "Surface.exe", Math.min(560, W - 40), 520, cascade(0) + 90, 40);
  WM.make("explorer", "Wiki Explorer", Math.min(720, W - 40), 500, cascade(1) + 60, 70);
  WM.make("note", "New Note", 380, 300, cascade(2) + 240, 110);
  WM.make("changes", "Recent Changes", 560, 380, cascade(3) + 140, 130);
  WM.make("search", "Search", 480, 420, cascade(4) + 200, 90);
  WM.make("oracle", "Oracle.exe", Math.min(540, W - 40), 480, cascade(5) + 260, 60);
  WM.make("why", "why.exe", Math.min(640, W - 40), 540, cascade(6) + 220, 50);
  WM.make("about", "About PFC", 380, 300, cascade(7) + 300, 150);
}

async function boot() {
  buildDesktop();
  if (!document.querySelector(".window.app")) buildWindows();
  const sf = document.getElementById("start-flag");
  sf.dataset.icon = "flag"; sf.dataset.sz = "16";
  const lk = document.getElementById("logon-keys");
  lk.dataset.icon = "keys"; lk.dataset.sz = "32";
  refreshIcons();
  if (DEMO && !document.getElementById("tray-demo")) {
    const f = document.createElement("span");
    f.id = "tray-demo"; f.textContent = "DEMO";
    document.getElementById("tray").prepend(f);
  }
  const logon = document.getElementById("logon");
  if (DEMO || token()) {
    logon.classList.add("hidden");
    try {
      await getTree();
      WM.show("surface");
    } catch (e) {
      if (e.message === "auth") { localStorage.removeItem(LS_KEY); showLogon("That token was refused (401). Try again."); }
      else if (e.message === "rate") showLogon("GitHub rate limit hit — your token is fine; wait a minute and press OK.");
      else showLogon("Could not reach GitHub: " + e.message);
    }
  } else showLogon();
}

function showLogon(msg) {
  const logon = document.getElementById("logon");
  logon.classList.remove("hidden");
  document.getElementById("logon-err").textContent = msg || "";
  const input = document.getElementById("token-input");
  document.getElementById("logon-ok").onclick = async () => {
    localStorage.setItem(LS_KEY, input.value.trim());
    input.value = "";
    boot();
  };
  document.getElementById("logon-demo").onclick = () => {
    location.href = location.pathname + "?demo=1";
  };
  input.onkeydown = e => { if (e.key === "Enter") document.getElementById("logon-ok").click(); };
}
